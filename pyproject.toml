[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-data-extractor"
version = "1.0.0"
description = "Web Metadata Extractor & Website Crawler"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.scripts]
meta-d = "extractor:main"
mata-d = "extractor:main"
mte = "extractor:main"
